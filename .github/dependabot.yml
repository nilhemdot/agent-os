version: 2
updates:
  - package-ecosystem: npm
    directory: /source
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    # Groups only bundle minor/patch bumps; every major bump gets its own PR
    # so a breaking upgrade (e.g. ESLint 10) can't sink a whole group.
    groups:
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react', '@types/react-dom']
        update-types: [minor, patch]
      types:
        patterns: ['@types/*']
        update-types: [minor, patch]
      lint:
        patterns: ['eslint', '@eslint/*', 'eslint-plugin-*', 'typescript-eslint', 'globals']
        update-types: [minor, patch]
      minor-and-patch:
        update-types: [minor, patch]
    # Majors that need a deliberate migration; minor/patch updates still flow.
    ignore:
      # typescript-eslint supports typescript <6.1, and 7.x is the native (Go)
      # compiler; upgrade TypeScript by hand once typescript-eslint catches up.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Keep Node typings on the runtime line (.nvmrc / CI: Node 22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
